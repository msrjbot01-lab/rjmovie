<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genre Film - RJMOVIE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .genre-container {
            padding: 40px 5%;
            min-height: 60vh;
            color: #fff;
        }
        .genre-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .genre-box {
            background: #1f1f1f;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            border: 1px solid #333;
            transition: 0.3s;
        }
        .genre-box:hover {
            background: #3b82f6;
            border-color: #3b82f6;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <!-- Header & Navbar -->
    <header class="header">
        <div class="logo-container">
            <a href="index.html">
                <img src="logorjmovie.png" alt="RJMOVIE Logo" class="site-logo">
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="index.html"><i class="fas fa-film"></i> Movies</a></li>
            <li><a href="serial.html"><i class="fas fa-tv"></i> Serial Tv</a></li>
            <li><a href="genre.html" class="active"><i class="fas fa-tags"></i> Genre</a></li>
            <li><a href="negara.html"><i class="fas fa-globe"></i> Negara</a></li>
        </ul>
        <div class="search-box">
            <input type="text" id="searchGenreInput" placeholder="Cari genre...">
            <button><i class="fas fa-search"></i></button>
        </div>
    </header>

    <!-- Konten Utama Genre -->
    <main class="genre-container">
        <h1 style="text-align: center; margin-bottom: 10px;">Kategori Genre Film</h1>
        <p style="text-align: center; color: #aaa;">Pilih kategori genre film yang ingin kamu tonton</p>
        
        <div id="genreGrid" class="genre-grid">
            <!-- Daftar genre akan dimuat otomatis di sini -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p><strong>Disclaimer:</strong> RJMOVIE tidak menyimpan file video di server sendiri. Seluruh video ditautkan dari pihak ketiga.</p>
            <p>&copy; 2026 RJMOVIE. All rights reserved.</p>
        </div>
    </footer>

    <!-- Script JavaScript untuk Menarik Data Genre -->
    <script>
        async function loadGenres() {
            try {
                const response = await fetch('movies.json');
                const movies = await response.json();
                
                // Ambil semua genre dari movies.json, pisahkan jika ada koma (misal: "Action, Drama")
                let genreSet = new Set();
                movies.forEach(movie => {
                    if (movie.genre) {
                        movie.genre.split(',').forEach(g => {
                            genreSet.add(g.trim());
                        });
                    }
                });

                const genreGrid = document.getElementById('genreGrid');
                genreGrid.innerHTML = '';

                if (genreSet.size === 0) {
                    genreGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888;">Belum ada genre tersedia.</p>';
                    return;
                }

                // Tampilkan kotak genre ke layar
                genreSet.forEach(genre => {
                    genreGrid.innerHTML += `
                        <a href="index.html?genre=${encodeURIComponent(genre)}" class="genre-box">
                            <i class="fas fa-film" style="display: block; margin-bottom: 10px; color: #3b82f6;"></i>
                            ${genre}
                        </a>
                    `;
                });

            } catch (error) {
                console.error("Gagal memuat genre:", error);
            }
        }

        loadGenres();
    </script>
</body>
</html>
