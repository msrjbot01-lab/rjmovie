<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJMOVIE - Streaming & Download Film Gratis</title>
    <!-- Tailwind CSS untuk Desain Modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-blue-500 tracking-wider">RJ<span class="text-white">MOVIE</span></h1>
            <input type="text" id="searchInput" placeholder="Cari film..." class="bg-slate-800 text-sm text-white px-4 py-2 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 w-48 md:w-64">
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="mb-8">
            <h2 class="text-xl font-bold mb-2">🎬 Film Terbaru & Populer</h2>
            <p class="text-slate-400 text-sm">Nikmati streaming dan unduh film favoritmu dengan mudah.</p>
        </div>

        <!-- Grid Daftar Film -->
        <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6">
            <!-- Data film akan dimuat otomatis oleh JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        &copy; 2026 RJMOVIE. Powered by Cloudflare Pages & RJSEO.
    </footer>

    <!-- Script JavaScript untuk Menampilkan & Mencari Film -->
    <script>
        let moviesData = [];

        async function loadMovies() {
            try {
                let response = await fetch('movies.json');
                moviesData = await response.json();
                displayMovies(moviesData);
            } catch (error) {
                console.error("Gagal memuat data film:", error);
            }
        }

        function displayMovies(movies) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            
            if (movies.length === 0) {
                grid.innerHTML = '<p class="text-slate-400 col-span-full text-center">Film tidak ditemukan.</p>';
                return;
            }

            movies.forEach(movie => {
                grid.innerHTML += `
                    <div class="movie-card bg-slate-800 rounded-xl overflow-hidden shadow-lg border border-slate-700 flex flex-col justify-between">
                        <div>
                            <img src="${movie.poster}" alt="${movie.title}" class="w-full h-48 md:h-64 object-cover">
                            <div class="p-4">
                                <span class="text-xs bg-blue-600 px-2 py-0.5 rounded text-white font-semibold">${movie.genre}</span>
                                <h3 class="font-bold text-base mt-2 text-white truncate">${movie.title}</h3>
                                <p class="text-xs text-slate-400 mt-1">${movie.year}</p>
                            </div>
                        </div>
                        <div class="p-4 pt-0 flex gap-2">
                            <a href="${movie.streamUrl}" target="_blank" class="flex-1 bg-blue-600 hover:bg-blue-700 text-center text-xs font-bold py-2 rounded text-white transition">Stream</a>
                            <a href="${movie.downloadUrl}" class="flex-1 bg-slate-700 hover:bg-slate-600 text-center text-xs font-bold py-2 rounded text-white transition">Download</a>
                        </div>
                    </div>
                `;
            });
        }

        // Fitur Pencarian Realtime
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = moviesData.filter(m => m.title.toLowerCase().includes(keyword));
            displayMovies(filtered);
        });

        loadMovies();
    </script>
</body>
</html>
