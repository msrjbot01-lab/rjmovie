<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJMOVIE - Nonton Film Streaming Online Gratis</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* CSS Banner Full 100% Lebar Layar dengan Model Slider */
        .hero-banner {
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            margin-bottom: 25px;
            overflow: hidden;
            background: #000;
        }

        .slider-container {
            display: flex;
            transition: transform 0.5s ease-in-out;
            width: 100%;
        }

        .slide {
            min-width: 100%;
            box-sizing: border-box;
        }

        .slide img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Tombol Navigasi Slider (Kiri & Kanan) */
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 12px 15px;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 10;
            transition: background 0.3s;
            border-radius: 4px;
        }

        .slider-btn:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        .prev-btn { left: 15px; }
        .next-btn { right: 15px; }

        /* Titik Indikator Slider di Bawah */
        .slider-dots {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s;
        }

        .dot.active {
            background-color: #ffffff;
            width: 25px;
            border-radius: 5px;
        }

        /* Menyembunyikan teks sambutan lama */
        .hero-content {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Header & Navbar -->
    <header class="header">
        <div class="logo-container">
            <a href="index.html">
                <img src="logorjmovie.png" alt="RJMOVIE Logo" class="site-logo">
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="active"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="index.html"><i class="fas fa-film"></i> Movies</a></li>
            <li><a href="serial.html"><i class="fas fa-tv"></i> Serial Tv</a></li>
            <li><a href="genre.html"><i class="fas fa-tags"></i> Genre</a></li>
            <li><a href="negara.html"><i class="fas fa-globe"></i> Negara</a></li>
        </ul>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari film favorit...">
            <button><i class="fas fa-search"></i></button>
        </div>
    </header>

    <!-- Hero Banner / Full Banner Slider -->
    <div class="hero-banner">
        <div class="slider-container" id="sliderContainer">
            <!-- Tambahkan tag <div class="slide"><img src="nama-banner.png"></div> di bawah jika ingin menambah banner baru -->
            <div class="slide">
                <img src="banner1.png" alt="Banner 1">
            </div>
            <div class="slide">
                <img src="banner2.png" alt="Banner 2">
            </div>
            <!-- Contoh banner ke-3 (hapus komentar jika file gambarnya sudah ada) -->
            <!-- 
            <div class="slide">
                <img src="banner3.png" alt="Banner 3">
            </div> 
            -->
        </div>

        <!-- Tombol Panah Slider -->
        <button class="slider-btn prev-btn" onclick="moveSlide(-1)"><i class="fas fa-chevron-left"></i></button>
        <button class="slider-btn next-btn" onclick="moveSlide(1)"><i class="fas fa-chevron-right"></i></button>

        <!-- Titik Indikator -->
        <div class="slider-dots" id="sliderDots"></div>
    </div>

    <!-- Filter Section -->
    <div class="filter-section" id="filterContainer">
        <button class="filter-btn active" data-filter="Semua">Semua</button>
        <button class="filter-btn" data-filter="Terbaru">Terbaru</button>
        <button class="filter-btn" data-filter="Action">Action</button>
        <button class="filter-btn" data-filter="Horror">Horror</button>
        <button class="filter-btn" data-filter="Comedy">Comedy</button>
        <button class="filter-btn" data-filter="Sci-Fi">Sci-Fi</button>
    </div>

    <!-- Konten Utama (Grid Film) -->
    <main class="main-container">
        <div class="section-title">
            <h2><i class="fas fa-fire text-blue"></i> Sedang Trending</h2>
        </div>
        <div id="movieGrid" class="movie-grid">
            <!-- Data film dimuat otomatis oleh JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p><strong>Disclaimer:</strong> RJMOVIE tidak menyimpan file video di server sendiri. Seluruh video ditautkan dari pihak ketiga.</p>
            <p>&copy; 2026 RJMOVIE. All rights reserved.</p>
        </div>
    </footer>

    <!-- Script JavaScript untuk Slider & Film -->
    <script>
        // --- Logika Banner Slider ---
        let currentIndex = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;
        const sliderContainer = document.getElementById('sliderContainer');
        const dotsContainer = document.getElementById('sliderDots');

        // Membuat titik indikator secara otomatis sesuai jumlah banner
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === 0) dot.classList.add('active');
            dot.addEventListener('click', () => goToSlide(i));
            dotsContainer.appendChild(dot);
        }

        const dots = document.querySelectorAll('.dot');

        function updateSlider() {
            sliderContainer.style.transform = `translateX(-${currentIndex * 100}%)`;
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentIndex);
            });
        }

        function moveSlide(direction) {
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = totalSlides - 1;
            } else if (currentIndex >= totalSlides) {
                currentIndex = 0;
            }
            updateSlider();
        }

        function goToSlide(index) {
            currentIndex = index;
            updateSlider();
        }

        // Auto slide berganti otomatis tiap 4 detik
        let slideInterval = setInterval(() => {
            moveSlide(1);
        }, 4000);

        // Hentikan auto-slide saat mouse diarahkan ke banner (agar nyaman dibaca)
        const bannerElement = document.querySelector('.hero-banner');
        bannerElement.addEventListener('mouseenter', () => clearInterval(slideInterval));
        bannerElement.addEventListener('mouseleave', () => {
            slideInterval = setInterval(() => {
                moveSlide(1);
            }, 4000);
        });


        // --- Logika Film & Pencarian ---
        let allMovies = [];
        let currentFilter = 'Semua';

        async function loadMovies() {
            try {
                const response = await fetch('movies.json');
                allMovies = await response.json();
                renderMovies(allMovies);
            } catch (error) {
                console.error("Gagal memuat data film:", error);
            }
        }

        function renderMovies(moviesToRender) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';

            if (moviesToRender.length === 0) {
                grid.innerHTML = '<p style="color: #888; grid-column: 1/-1; text-align: center; padding: 40px;">Film tidak ditemukan.</p>';
                return;
            }

            moviesToRender.forEach(movie => {
                const qualityClass = movie.quality === 'CAM' ? 'cam' : '';
                
                const card = `
                    <div class="movie-card">
                        <a href="watch.html?title=${encodeURIComponent(movie.title)}" class="movie-link">
                            <div class="movie-poster-container">
                                <img src="${movie.poster}" alt="${movie.title}" class="movie-poster">
                                <div class="overlay-top">
                                    <span class="rating-tag"><i class="fas fa-star"></i> ${movie.rating}</span>
                                    <span class="duration-tag"><i class="far fa-clock"></i> ${movie.duration}</span>
                                </div>
                                <span class="quality-tag ${qualityClass}">${movie.quality || 'HD'}</span>
                                <div class="play-overlay">
                                    <i class="fas fa-play-circle play-icon"></i>
                                </div>
                            </div>
                            <div class="movie-info">
                                <h3 class="movie-title">${movie.title}</h3>
                                <p class="movie-meta">${movie.year} &bull; ${movie.genre}</p>
                            </div>
                        </a>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // Logika Tombol Filter
        const filterButtons = document.querySelectorAll('.filter-btn');
        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                currentFilter = button.getAttribute('data-filter');
                applyFilterAndSearch();
            });
        });

        // Logika Kotak Pencarian (Search Input)
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', () => {
                applyFilterAndSearch();
            });
        }

        function applyFilterAndSearch() {
            const keyword = searchInput ? searchInput.value.toLowerCase().trim() : '';

            let result = allMovies.filter(movie => {
                const matchTitle = movie.title.toLowerCase().includes(keyword);

                let matchCategory = true;
                if (currentFilter === 'Terbaru') {
                    matchCategory = parseInt(movie.year) >= 2024;
                } else if (currentFilter !== 'Semua') {
                    matchCategory = movie.genre && movie.genre.toLowerCase().includes(currentFilter.toLowerCase());
                }

                return matchTitle && matchCategory;
            });

            renderMovies(result);
        }

        loadMovies();
    </script>
</body>
</html>
