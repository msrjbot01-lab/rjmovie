<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJMOVIE - Nonton Film Streaming Online Gratis</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header dengan Logo Gambar -->
    <header class="header">
        <div class="logo-container">
            <a href="index.html">
                <img src="logorjmovie.png" alt="RJMOVIE Logo" class="site-logo">
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="#"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="#"><i class="fas fa-film"></i> Movies</a></li>
            <li><a href="#"><i class="fas fa-tv"></i> Serial Tv</a></li>
            <li><a href="#"><i class="fas fa-tags"></i> Genre</a></li>
            <li><a href="#"><i class="fas fa-globe"></i> Negara</a></li>
            <li><a href="#"><i class="fas fa-calendar-alt"></i> Tahun</a></li>
        </ul>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search..">
            <button><i class="fas fa-search"></i></button>
        </div>
    </header>

    <!-- Filter Section -->
    <div class="filter-section">
        <button class="filter-btn">Featured</button>
        <button class="filter-btn">Film Terbaru</button>
        <button class="filter-btn">Romance</button>
        <button class="filter-btn">Drama</button>
        <button class="filter-btn">Action</button>
        <button class="filter-btn">Sci - Fi</button>
    </div>

    <!-- Konten Utama -->
    <div class="main-container">
        <div id="movieGrid" class="movie-grid">
            <!-- Data film akan dimuat di sini oleh JavaScript -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>Disclaimer: RJMOVIE tidak menyimpan file film di servernya sendiri. Semua video dihosting oleh pihak ketiga.</p>
        <p>&copy; 2026 RJMOVIE. All rights reserved.</p>
    </footer>

    <!-- Script JavaScript -->
    <script>
        async function loadMovies() {
            try {
                const response = await fetch('movies.json');
                const movies = await response.json();
                const grid = document.getElementById('movieGrid');
                grid.innerHTML = '';

                movies.forEach(movie => {
                    const qualityClass = movie.quality === 'CAM' ? 'cam' : '';
                    const flag = movie.country === 'ID' ? '🇮🇩' : '🇺🇸';

                    const card = `
                        <div class="movie-card">
                            <a href="#" class="movie-link">
                                <div class="movie-poster-container">
                                    <img src="${movie.poster}" alt="${movie.title}" class="movie-poster">
                                    <div class="overlay-top">
                                        <span class="rating-tag"><i class="fas fa-star"></i> ${movie.rating}</span>
                                        <span class="duration-tag"><i class="far fa-clock"></i> ${movie.duration}</span>
                                    </div>
                                    <span class="quality-tag ${qualityClass}">${movie.quality}</span>
                                    <div class="flag-icon" style="font-size: 16px; color: transparent; display:none;">${flag}</div>
                                    <i class="fas fa-play-circle play-icon"></i>
                                </div>
                                <div class="movie-info">
                                    <h3 class="movie-title">${movie.title}</h3>
                                    <p class="movie-meta">${movie.year} • ${movie.genre}</p>
                                </div>
                            </a>
                        </div>
                    `;
                    grid.innerHTML += card;
                });
            } catch (error) {
                console.error("Error loading movies:", error);
            }
        }

        loadMovies();
    </script>
</body>
</html>
