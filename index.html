<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJMOVIE - Nonton Film Streaming Online Gratis</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* --- RESET & BODY OTOMATIS RESPONSIF --- */
        body {
            margin: 0;
            background-color: #0f172a;
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* --- WRAPPER UTAMA OTOMATIS SESUAI BROWSER --- */
        .wrapper-full {
            width: 92%;
            max-width: 1600px; /* Batas maksimal agar tidak terlalu melar di layar ultra-wide */
            margin: 0 auto;
            padding: 0 15px;
            box-sizing: border-box;
        }

        /* --- HEADER & NAVBAR RESPONSIF --- */
        .header {
            width: 92%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 15px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            flex-wrap: wrap;
            gap: 15px;
        }

        .site-logo {
            height: 35px;
            width: auto;
            display: block;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
            align-items: center;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #3b82f6;
        }

        /* --- KOTAK PENCARIAN RESPONSIF --- */
        .search-box {
            display: flex;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-box input {
            background: transparent;
            border: none;
            padding: 8px 12px;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
            width: 180px;
        }

        .search-box button {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 0 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: #2563eb;
        }

        /* --- CSS BANNER SLIDER (Tetap Full-Width 100vw, tapi proporsional) --- */
        .hero-banner {
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            margin-bottom: 25px;
            overflow: hidden;
            background: #000;
            max-height: 400px;
        }

        .slider-container {
            display: flex;
            transition: transform 0.5s ease-in-out;
            width: 100%;
        }

        .slide {
            min-width: 100%;
            box-sizing: border-box;
        }

        .slide img {
            width: 100%;
            height: 400px;
            display: block;
            object-fit: cover;
        }

        /* Tombol Navigasi Slider */
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 1rem;
            z-index: 10;
            transition: background 0.3s;
            border-radius: 4px;
        }
        .slider-btn:hover { background-color: rgba(0, 0, 0, 0.8); }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        /* Titik Indikator Slider */
        .slider-dots {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
        }
        .dot {
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s, width 0.3s;
        }
        .dot.active {
            background-color: #ffffff;
            width: 20px;
            border-radius: 4px;
        }
        .hero-content { display: none; }

        /* --- FILTER SECTION RESPONSIF --- */
        .filter-section {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .filter-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }

        /* --- GRID FILM OTOMATIS MENYESUAIKAN LAYAR --- */
        .main-container {
            margin-bottom: 40px;
        }

        .section-title h2 {
            font-size: 1.25rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        /* Styling Kartu Film */
        .movie-card {
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .movie-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .movie-poster-container {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            overflow: hidden;
            background: #000;
        }

        .movie-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .movie-card:hover .movie-poster {
            transform: scale(1.05);
        }

        .overlay-top {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            z-index: 2;
        }

        .rating-tag {
            background: rgba(0, 0, 0, 0.7);
            color: #fbbf24;
            padding: 3px 6px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        .duration-tag {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 3px 6px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        .quality-tag {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: #3b82f6;
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            z-index: 2;
        }
        .quality-tag.cam { background: #ef4444; }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .play-icon {
            font-size: 3rem;
            color: #3b82f6;
        }

        .movie-card:hover .play-overlay {
            opacity: 1;
        }

        .movie-info {
            padding: 12px;
        }

        .movie-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            font-size: 0.8rem;
            color: #94a3b8;
            margin: 0;
        }

        /* --- FOOTER --- */
        .footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px 0;
            margin-top: 50px;
            color: #94a3b8;
            font-size: 0.85rem;
            text-align: center;
        }

        /* --- MEDIA QUERIES KHUSUS HP / TABLET --- */
        @media (max-width: 768px) {
            .hero-banner, .slide img {
                max-height: 200px;
                height: 200px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .nav-links {
                justify-content: center;
                gap: 15px;
                font-size: 0.85rem;
                overflow-x: auto;
                padding-bottom: 5px;
            }
            .search-box {
                width: 100%;
            }
            .search-box input {
                width: 100%;
            }
            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Header & Navbar Otomatis Responsif -->
    <header class="header">
        <div class="logo-container">
            <a href="index.html">
                <img src="logorjmovie.png" alt="RJMOVIE Logo" class="site-logo">
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="active"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="index.html"><i class="fas fa-film"></i> Movies</a></li>
            <li><a href="serial.html"><i class="fas fa-tv"></i> Serial Tv</a></li>
            <li><a href="genre.html"><i class="fas fa-tags"></i> Genre</a></li>
            <li><a href="negara.html"><i class="fas fa-globe"></i> Negara</a></li>
        </ul>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cari film favorit...">
            <button><i class="fas fa-search"></i></button>
        </div>
    </header>

    <div class="wrapper-full">
        <!-- Hero Banner Slider -->
        <div class="hero-banner">
            <div class="slider-container" id="sliderContainer"></div>
            <button class="slider-btn prev-btn" onclick="moveSlide(-1)"><i class="fas fa-chevron-left"></i></button>
            <button class="slider-btn next-btn" onclick="moveSlide(1)"><i class="fas fa-chevron-right"></i></button>
            <div class="slider-dots" id="sliderDots"></div>
        </div>

        <!-- Filter Section -->
        <div class="filter-section" id="filterContainer">
            <button class="filter-btn active" data-filter="Semua">Semua</button>
            <button class="filter-btn" data-filter="Terbaru">Terbaru</button>
            <button class="filter-btn" data-filter="Action">Action</button>
            <button class="filter-btn" data-filter="Horror">Horror</button>
            <button class="filter-btn" data-filter="Comedy">Comedy</button>
            <button class="filter-btn" data-filter="Sci-Fi">Sci-Fi</button>
        </div>

        <!-- Konten Utama (Grid Film) -->
        <main class="main-container">
            <div class="section-title">
                <h2><i class="fas fa-fire" style="color: #3b82f6;"></i> Sedang Trending</h2>
            </div>
            <div id="movieGrid" class="movie-grid"></div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="wrapper-full footer-content">
            <p><strong>Disclaimer:</strong> RJMOVIE tidak menyimpan file video di server sendiri. Seluruh video ditautkan dari pihak ketiga.</p>
            <p>&copy; 2026 RJMOVIE. All rights reserved.</p>
        </div>
    </footer>

    <!-- Script JavaScript -->
    <script>
        let currentIndex = 0;
        let totalSlides = 0;
        let slideInterval;

        async function loadBanners() {
            try {
                const response = await fetch('banners.json');
                if (!response.ok) throw new Error('File banners.json tidak ditemukan');
                const banners = await response.json();
                
                const sliderContainer = document.getElementById('sliderContainer');
                const dotsContainer = document.getElementById('sliderDots');
                
                sliderContainer.innerHTML = '';
                dotsContainer.innerHTML = '';
                totalSlides = banners.length;

                if (totalSlides === 0) {
                    sliderContainer.innerHTML = '<div class="slide"><p style="text-align:center; padding:50px; color:#888;">Belum ada banner tersedia.</p></div>';
                    return;
                }

                banners.forEach((banner, index) => {
                    const slideDiv = document.createElement('div');
                    slideDiv.classList.add('slide');
                    slideDiv.innerHTML = `<img src="${banner.image}" alt="${banner.title || 'Banner'}">`;
                    sliderContainer.appendChild(slideDiv);

                    const dot = document.createElement('div');
                    dot.classList.add('dot');
                    if (index === 0) dot.classList.add('active');
                    dot.addEventListener('click', () => goToSlide(index));
                    dotsContainer.appendChild(dot);
                });

                startAutoSlide();
            } catch (error) {
                console.error("Gagal memuat banner:", error);
                document.getElementById('sliderContainer').innerHTML = '<div class="slide"><p style="text-align:center; padding:50px; color:#ef4444;">Gagal memuat banners.json</p></div>';
            }
        }

        function updateSlider() {
            const sliderContainer = document.getElementById('sliderContainer');
            const dots = document.querySelectorAll('.dot');
            sliderContainer.style.transform = `translateX(-${currentIndex * 100}%)`;
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentIndex);
            });
        }

        function moveSlide(direction) {
            if (totalSlides === 0) return;
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = totalSlides - 1;
            } else if (currentIndex >= totalSlides) {
                currentIndex = 0;
            }
            updateSlider();
        }

        function goToSlide(index) {
            currentIndex = index;
            updateSlider();
        }

        function startAutoSlide() {
            slideInterval = setInterval(() => {
                moveSlide(1);
            }, 4000);

            const bannerElement = document.querySelector('.hero-banner');
            bannerElement.addEventListener('mouseenter', () => clearInterval(slideInterval));
            bannerElement.addEventListener('mouseleave', () => {
                slideInterval = setInterval(() => {
                    moveSlide(1);
                }, 4000);
            });
        }

        let allMovies = [];
        let currentFilter = 'Semua';

        async function loadMovies() {
            try {
                const response = await fetch('movies.json');
                allMovies = await response.json();
                renderMovies(allMovies);
            } catch (error) {
                console.error("Gagal memuat data film:", error);
            }
        }

        function renderMovies(moviesToRender) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';

            if (moviesToRender.length === 0) {
                grid.innerHTML = '<p style="color: #888; grid-column: 1/-1; text-align: center; padding: 40px;">Film tidak ditemukan.</p>';
                return;
            }

            moviesToRender.forEach(movie => {
                const qualityClass = movie.quality === 'CAM' ? 'cam' : '';
                const card = `
                    <div class="movie-card">
                        <a href="watch.html?title=${encodeURIComponent(movie.title)}" class="movie-link">
                            <div class="movie-poster-container">
                                <img src="${movie.poster}" alt="${movie.title}" class="movie-poster">
                                <div class="overlay-top">
                                    <span class="rating-tag"><i class="fas fa-star"></i> ${movie.rating}</span>
                                    <span class="duration-tag"><i class="far fa-clock"></i> ${movie.duration}</span>
                                </div>
                                <span class="quality-tag ${qualityClass}">${movie.quality || 'HD'}</span>
                                <div class="play-overlay">
                                    <i class="fas fa-play-circle play-icon"></i>
                                </div>
                            </div>
                            <div class="movie-info">
                                <h3 class="movie-title">${movie.title}</h3>
                                <p class="movie-meta">${movie.year} &bull; ${movie.genre}</p>
                            </div>
                        </a>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        const filterButtons = document.querySelectorAll('.filter-btn');
        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                currentFilter = button.getAttribute('data-filter');
                applyFilterAndSearch();
            });
        });

        const searchInput = document.getElementById('searchInput');
        const searchBoxContainer = document.querySelector('.search-box');
        const searchButton = searchBoxContainer ? searchBoxContainer.querySelector('button') : null;

        if (searchInput) {
            searchInput.addEventListener('input', () => applyFilterAndSearch());
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') applyFilterAndSearch();
            });
        }

        if (searchButton) {
            searchButton.addEventListener('click', (e) => {
                e.preventDefault();
                applyFilterAndSearch();
            });
        }

        function applyFilterAndSearch() {
            const keyword = searchInput ? searchInput.value.toLowerCase().trim() : '';
            let result = allMovies.filter(movie => {
                const matchTitle = movie.title.toLowerCase().includes(keyword);
                let matchCategory = true;
                if (currentFilter === 'Terbaru') {
                    matchCategory = parseInt(movie.year) >= 2024;
                } else if (currentFilter !== 'Semua') {
                    matchCategory = movie.genre && movie.genre.toLowerCase().includes(currentFilter.toLowerCase());
                }
                return matchTitle && matchCategory;
            });
            renderMovies(result);
        }

        loadBanners();
        loadMovies();
    </script>
</body>
</html>
