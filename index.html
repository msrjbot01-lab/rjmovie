<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJMOVIE - Nonton Film Streaming Online Gratis</title>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Perbaikan khusus agar banner tampil utuh dan proporsional */
        .hero-banner {
            width: 100%;
            max-width: 100%;
            position: relative;
            margin-top: 20px;
            margin-bottom: 25px;
            border-radius: 14px;
            background: #0f172a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            aspect-ratio: 16 / 5.2;
            max-height: 380px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-sizing: border-box;
        }

        .slider-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            width: 100%;
            height: 100%;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .slider-container::-webkit-scrollbar {
            display: none;
        }

        .slide {
            min-width: 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            position: relative;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Diubah ke contain agar gambar banner tidak terpotong */
            background-color: #0b0f19;
            object-position: center;
            display: block;
        }

        .slide .img-mobile {
            display: none;
        }
        .slide .img-desktop {
            display: block;
        }

        .slider-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transition: all 0.3s;
        }
        .dot.active {
            background-color: #3b82f6;
            width: 18px;
            border-radius: 4px;
        }

        @media screen and (max-width: 768px) {
            .hero-banner {
                aspect-ratio: 16 / 9;
                max-height: 220px;
            }
            .slide .img-desktop {
                display: none !important;
            }
            .slide .img-mobile {
                display: block !important;
                width: 100%;
                height: 100%;
                object-fit: contain;
                background-color: #0b0f19;
                object-position: center;
            }
        }
    </style>
</head>
<body>

    <div class="page-content-wrapper" style="width:100%; display:flex; flex-direction:column; align-items:center;">
        <header class="header" style="width:100%;">
            <div class="logo-container">
                <a href="index.html">
                    <img src="logorjmovie.png" alt="RJMOVIE Logo" class="site-logo">
                </a>
            </div>
            
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="active"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="index.html"><i class="fas fa-film"></i> Movies</a></li>
                <li><a href="serial.html"><i class="fas fa-tv"></i> Serial Tv</a></li>
                <li><a href="genre.html"><i class="fas fa-tags"></i> Genre</a></li>
                <li><a href="negara.html"><i class="fas fa-globe"></i> Negara</a></li>
            </ul>

            <div class="header-right">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Cari film favorit...">
                    <button type="button"><i class="fas fa-search"></i></button>
                </div>
                <button class="mobile-search-btn" id="mobileSearchBtn" aria-label="Open Search">
                    <i class="fas fa-search"></i>
                </button>
                <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </header>

        <div class="mobile-search-modal" id="mobileSearchModal">
            <input type="text" id="mobileSearchInput" placeholder="Cari film favorit...">
            <button class="mobile-search-close" id="mobileSearchClose"><i class="fas fa-times"></i></button>
        </div>

        <div class="wrapper-full" style="width: 100%; max-width: 1350px; padding: 0 24px; box-sizing: border-box;">
            <div class="hero-banner">
                <div class="slider-container" id="sliderContainer"></div>
                <div class="slider-dots" id="sliderDots"></div>
            </div>

            <div class="filter-section" id="filterContainer">
                <button class="filter-btn active" data-filter="Semua">Semua</button>
                <button class="filter-btn" data-filter="Terbaru">Terbaru</button>
                <button class="filter-btn" data-filter="Action">Action</button>
                <button class="filter-btn" data-filter="Horror">Horror</button>
                <button class="filter-btn" data-filter="Comedy">Comedy</button>
                <button class="filter-btn" data-filter="Sci-Fi">Sci-Fi</button>
            </div>

            <main class="main-container">
                <div class="section-title">
                    <h2><i class="fas fa-fire" style="color: #3b82f6;"></i> Sedang Trending</h2>
                </div>
                <div id="movieGrid" class="movie-grid"></div>
            </main>
        </div>
    </div>

    <footer class="footer">
        <p><strong>Disclaimer:</strong> RJMOVIE tidak menyimpan file video di server sendiri.</p>
        <p style="margin-top: 4px;">&copy; 2026 RJMOVIE. All rights reserved.</p>
    </footer>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');

        if (menuToggle && navLinks) {
            menuToggle.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                const icon = menuToggle.querySelector('i');
                if (navLinks.classList.contains('active')) {
                    icon.classList.remove('fa-bars');
                    icon.classList.add('fa-times');
                } else {
                    icon.classList.remove('fa-times');
                    icon.classList.add('fa-bars');
                }
            });
        }

        const mobileSearchBtn = document.getElementById('mobileSearchBtn');
        const mobileSearchModal = document.getElementById('mobileSearchModal');
        const mobileSearchClose = document.getElementById('mobileSearchClose');
        const mobileSearchInput = document.getElementById('mobileSearchInput');
        const searchInput = document.getElementById('searchInput');

        if (mobileSearchBtn && mobileSearchModal) {
            mobileSearchBtn.addEventListener('click', () => {
                mobileSearchModal.classList.add('active');
                if(mobileSearchInput) mobileSearchInput.focus();
            });
        }

        if (mobileSearchClose && mobileSearchModal) {
            mobileSearchClose.addEventListener('click', () => {
                mobileSearchModal.classList.remove('active');
            });
        }

        let slideInterval;
        let totalSlides = 0;

        async function loadBanners() {
            try {
                const response = await fetch('banners.json');
                if (!response.ok) throw new Error('File banners.json tidak ditemukan');
                const banners = await response.json();
                
                const sliderContainer = document.getElementById('sliderContainer');
                const dotsContainer = document.getElementById('sliderDots');
                
                if (!sliderContainer || !dotsContainer) return;

                sliderContainer.innerHTML = '';
                dotsContainer.innerHTML = '';
                totalSlides = banners.length;

                if (totalSlides === 0) {
                    sliderContainer.innerHTML = '<div class="slide"><p style="text-align:center; padding:40px; color:#888;">Belum ada banner tersedia.</p></div>';
                    return;
                }

                banners.forEach((banner, index) => {
                    const slideDiv = document.createElement('div');
                    slideDiv.classList.add('slide');
                    
                    const desktopImg = banner.image || '';
                    const mobileImg = banner.mobileImage || desktopImg; 
                    
                    slideDiv.innerHTML = `
                        <img src="${desktopImg}" alt="${banner.title || 'Banner'}" class="img-desktop">
                        <img src="${mobileImg}" alt="${banner.title || 'Banner'}" class="img-mobile">
                    `;
                    sliderContainer.appendChild(slideDiv);

                    const dot = document.createElement('div');
                    dot.classList.add('dot');
                    if (index === 0) dot.classList.add('active');
                    dotsContainer.appendChild(dot);
                });

                if (totalSlides <= 1) {
                    dotsContainer.style.display = 'none';
                } else {
                    setupAutoAndScrollListener();
                }

            } catch (error) {
                console.error("Gagal memuat banner:", error);
                const sliderContainer = document.getElementById('sliderContainer');
                if (sliderContainer) {
                    sliderContainer.innerHTML = '<div class="slide"><p style="text-align:center; padding:40px; color:#ef4444; font-size:0.85rem;">Gagal memuat banners.json</p></div>';
                }
            }
        }

        function setupAutoAndScrollListener() {
            const sliderContainer = document.getElementById('sliderContainer');
            const dots = document.querySelectorAll('.dot');
            if (!sliderContainer) return;
            
            sliderContainer.addEventListener('scroll', () => {
                const index = Math.round(sliderContainer.scrollLeft / sliderContainer.clientWidth);
                dots.forEach((dot, i) => {
                    dot.classList.toggle('active', i === index);
                });
            });

            let currentIndex = 0;
            slideInterval = setInterval(() => {
                if (totalSlides === 0) return;
                currentIndex = (currentIndex + 1) % totalSlides;
                sliderContainer.scrollTo({
                    left: currentIndex * sliderContainer.clientWidth,
                    behavior: 'smooth'
                });
            }, 4000);

            const bannerElement = document.querySelector('.hero-banner');
            if (bannerElement) {
                bannerElement.addEventListener('mouseenter', () => clearInterval(slideInterval));
                bannerElement.addEventListener('touchstart', () => clearInterval(slideInterval));
            }
        }

        let allMovies = [];
        let currentFilter = 'Semua';

        async function loadMovies() {
            try {
                const response = await fetch('movies.json');
                if (!response.ok) throw new Error('File movies.json tidak ditemukan');
                allMovies = await response.json();
                renderMovies(allMovies);
            } catch (error) {
                console.error("Gagal memuat data film:", error);
                const grid = document.getElementById('movieGrid');
                if (grid) {
                    grid.innerHTML = '<p style="color: #ef4444; grid-column: 1/-1; text-align: center; padding: 30px;">Gagal memuat daftar film.</p>';
                }
            }
        }

        function renderMovies(moviesToRender) {
            const grid = document.getElementById('movieGrid');
            if (!grid) return;
            
            grid.innerHTML = '';

            if (!moviesToRender || moviesToRender.length === 0) {
                grid.innerHTML = '<p style="color: #888; grid-column: 1/-1; text-align: center; padding: 30px;">Film tidak ditemukan.</p>';
                return;
            }

            let htmlContent = '';
            moviesToRender.forEach(movie => {
                const qualityClass = movie.quality === 'CAM' ? 'cam' : '';
                htmlContent += `
                    <div class="movie-card">
                        <a href="watch.html?title=${encodeURIComponent(movie.title)}" class="movie-link">
                            <div class="movie-poster-container">
                                <img src="${movie.poster}" alt="${movie.title}" class="movie-poster">
                                <div class="overlay-top">
                                    <span class="rating-tag"><i class="fas fa-star"></i> ${movie.rating}</span>
                                    <span class="duration-tag"><i class="far fa-clock"></i> ${movie.duration}</span>
                                </div>
                                <span class="quality-tag ${qualityClass}">${movie.quality || 'HD'}</span>
                            </div>
                            <div class="movie-info">
                                <h3 class="movie-title">${movie.title}</h3>
                                <p class="movie-meta">${movie.year} &bull; ${movie.genre}</p>
                            </div>
                        </a>
                    </div>
                `;
            });
            grid.innerHTML = htmlContent;
        }

        const filterButtons = document.querySelectorAll('.filter-btn');
        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                currentFilter = button.getAttribute('data-filter');
                applyFilterAndSearch();
            });
        });

        if (searchInput) {
            searchInput.addEventListener('input', () => applyFilterAndSearch());
        }
        if (mobileSearchInput) {
            mobileSearchInput.addEventListener('input', (e) => {
                if (searchInput) searchInput.value = e.target.value;
                applyFilterAndSearch();
            });
        }

        function applyFilterAndSearch() {
            const activeInput = (window.innerWidth <= 768 && mobileSearchInput && mobileSearchInput.value) ? mobileSearchInput : searchInput;
            const keyword = activeInput ? activeInput.value.toLowerCase().trim() : '';
            
            let result = allMovies.filter(movie => {
                const matchTitle = movie.title.toLowerCase().includes(keyword);
                let matchCategory = true;
                
                if (currentFilter === 'Terbaru') {
                    matchCategory = parseInt(movie.year) >= 2025;
                } else if (currentFilter !== 'Semua') {
                    matchCategory = movie.genre && movie.genre.toLowerCase().includes(currentFilter.toLowerCase());
                }

                return matchTitle && matchCategory;
            });
            renderMovies(result);
        }

        loadBanners();
        loadMovies();
    </script>
</body>
</html>
