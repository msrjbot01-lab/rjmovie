<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Film - RJMOVIE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        #videoPlayer {
            width: 100%;
            display: block;
            border-radius: 8px;
        }
        .custom-play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
        }
        .play-icon-btn {
            width: 80px;
            height: 80px;
            background: rgba(59, 130, 246, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 30px;
            padding-left: 5px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <a href="index.html">
                <img src="logorjmovie.png" alt="RJMOVIE Logo" class="site-logo">
            </a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="index.html"><i class="fas fa-film"></i> Movies</a></li>
        </ul>
    </header>

    <main class="main-container watch-container">
        <div class="player-wrapper">
            <div class="video-container" id="videoContainer">
                <div class="custom-play-overlay" id="playOverlay">
                    <div class="play-icon-btn">
                        <i class="fas fa-play"></i>
                    </div>
                </div>
                <!-- Menggunakan native HTML5 video player -->
                <video id="videoPlayer" playsinline preload="metadata">
                    <source id="videoSource" src="" type="video/mp4">
                    Browser Anda tidak mendukung pemutar video ini.
                </video>
            </div>
            
            <div class="player-actions">
                <div class="view-count"><i class="fas fa-eye"></i> 814,497 views</div>
                <div class="action-buttons">
                    <a id="downloadBtn" href="#" target="_blank" class="btn-action" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;"><i class="fas fa-download"></i> DOWNLOAD</a>
                </div>
            </div>
        </div>

        <div class="movie-detail-box">
            <h1 id="movieTitleDisplay" class="detail-title">Memuat Judul...</h1>
            <p id="movieSynopsis" class="synopsis-text">Memuat sinopsis...</p>
        </div>
    </main>

    <script>
        async function loadMovieDetails() {
            const params = new URLSearchParams(window.location.search);
            const titleParam = params.get('title');

            if (!titleParam) return;

            try {
                const response = await fetch('movies.json');
                const movies = await response.json();
                const currentMovie = movies.find(m => m.title.toLowerCase() === decodeURIComponent(titleParam).toLowerCase());

                if (currentMovie) {
                    document.getElementById('movieTitleDisplay').innerText = `${currentMovie.title} (${currentMovie.year})`;
                    if(currentMovie.synopsis) document.getElementById('movieSynopsis').innerText = currentMovie.synopsis;

                    const videoPlayer = document.getElementById('videoPlayer');
                    const videoSource = document.getElementById('videoSource');
                    const playOverlay = document.getElementById('playOverlay');

                    if(currentMovie.videoUrl) {
                        videoSource.src = currentMovie.videoUrl;
                        videoPlayer.load();
                    }

                    playOverlay.addEventListener('click', function() {
                        videoPlayer.play().then(() => {
                            videoPlayer.setAttribute('controls', 'true');
                            playOverlay.style.display = 'none';
                        }).catch(err => console.log(err));
                    });

                    if(currentMovie.downloadUrl) {
                        document.getElementById('downloadBtn').href = currentMovie.downloadUrl;
                    }
                }
            } catch (e) {
                console.error("Gagal meload detail film", e);
            }
        }

        loadMovieDetails();
    </script>
</body>
</html>
