<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - RJMOVIE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Animasi Masuk */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
            50% { box-shadow: 0 0 30px rgba(59, 130, 246, 0.4); }
            100% { box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
        }

        body {
            background-color: #0f1015;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Header Minimalis Tanpa Logo Kiri */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #141824;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .admin-brand {
            font-size: 18px;
            font-weight: 700;
            color: #3b82f6;
            letter-spacing: 0.5px;
        }
        .nav-links {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }
        .nav-links li a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        .nav-links li a:hover {
            color: #3b82f6;
        }

        /* Wrapper Login dengan Efek Sinematik */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(85vh - 70px);
            padding: 20px;
        }
        .login-box {
            width: 100%;
            max-width: 420px;
            background: rgba(20, 24, 36, 0.85);
            backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(59, 130, 246, 0.3);
            animation: fadeInUp 0.8s ease-out, pulseGlow 4s infinite ease-in-out;
        }
        .login-logo {
            width: 150px;
            margin-bottom: 25px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
        }
        .login-logo:hover {
            transform: scale(1.05);
        }
        .login-box h2 {
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .login-box p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .login-box label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: 600;
            color: #cbd5e1;
            font-size: 13px;
        }
        .login-box input {
            width: 100%;
            padding: 12px 15px;
            background: #0f1015;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        .login-box input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }
        .login-box button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .login-box button:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }
        .error-msg {
            color: #ef4444;
            margin-top: 15px;
            font-size: 13px;
            display: none;
        }

        /* Styling Form Panel Admin Utama */
        .admin-form {
            max-width: 600px;
            margin: 40px auto;
            background: #141824;
            padding: 30px;
            border-radius: 12px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.5s ease-out;
        }
        .admin-form label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: 600; color: #cbd5e1; font-size: 14px; }
        .admin-form input, .admin-form textarea, .admin-form select { width: 100%; padding: 11px; background: #0f1015; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
        .admin-form input:focus, .admin-form textarea:focus, .admin-form select:focus { outline: none; border-color: #3b82f6; }
        .admin-form button { margin-top: 25px; width: 100%; padding: 12px; background: #3b82f6; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .admin-form button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <!-- Header Minimalis (Tanpa Logo di Kiri) -->
    <header class="header">
        <div class="admin-brand"><i class="fas fa-lock"></i> RJMOVIE Control Center</div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
        </ul>
    </header>

    <!-- TAMPILAN LOGIN DENGAN EFEK & LOGO DI TENGAH -->
    <div id="loginSection" class="login-wrapper">
        <div class="login-box">
            <img src="logorjmovie.png" alt="RJMOVIE Logo" class="login-logo">
            <h2>Admin Panel Login</h2>
            <p>Masukkan password rahasia untuk mengelola film.</p>
            <form id="loginForm">
                <label>Password:</label>
                <input type="password" id="adminPassword" required placeholder="Masukkan password...">
                <button type="submit"><i class="fas fa-sign-in-alt"></i> Masuk Dashboard</button>
                <p id="errorMsg" class="error-msg"><i class="fas fa-exclamation-circle"></i> Password salah! Silakan coba lagi.</p>
            </form>
        </div>
    </div>

    <!-- PANEL ADMIN UTAMA (Tersembunyi Sebelum Login) -->
    <main class="main-container" id="adminMain" style="display: none;">
        <div class="admin-form">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 15px;">
                <h2 style="margin:0; font-size: 20px;"><i class="fas fa-plus-circle text-blue"></i> Tambah Film Baru</h2>
                <button onclick="logoutAdmin()" style="width: auto; padding: 6px 14px; margin: 0; background: #ef4444; font-size: 12px;"><i class="fas fa-sign-out-alt"></i> Keluar</button>
            </div>
            
            <form id="addMovieForm">
                <label>Judul Film:</label>
                <input type="text" id="title" required placeholder="Contoh: Tumbal Birahi">

                <label>Tahun Rilis:</label>
                <input type="number" id="year" required value="2026">

                <label>Genre (Pisahkan dengan koma):</label>
                <input type="text" id="genre" required placeholder="Horror, Action, Comedy">

                <label>Rating (Contoh: 6.8):</label>
                <input type="text" id="rating" required value="7.0">

                <label>Durasi (Contoh: 90 Menit):</label>
                <input type="text" id="duration" required value="90 Menit">

                <label>Kualitas (HD / CAM):</label>
                <select id="quality">
                    <option value="HD">HD</option>
                    <option value="CAM">CAM</option>
                </select>

                <label>Nama File Poster (Contoh: film1.png):</label>
                <input type="text" id="poster" required value="film1.png">

                <label>Sutradara:</label>
                <input type="text" id="director" required>

                <label>Negara:</label>
                <input type="text" id="country" required value="Indonesia">

                <label>Pemeran (Cast):</label>
                <input type="text" id="cast" required>

                <label>Sinopsis:</label>
                <textarea id="synopsis" rows="4" required></textarea>

                <label>Link Direct Video (.mp4 Internet Archive):</label>
                <input type="text" id="videoUrl" required placeholder="https://archive.org/download/.../file.mp4">

                <button type="submit"><i class="fas fa-save"></i> Generate JSON Data</button>
            </form>

            <div id="outputSection" style="margin-top: 25px; display: none;">
                <label>Hasil JSON (Salin dan perbarui isi file <code>movies.json</code> Anda):</label>
                <textarea id="jsonOutput" rows="6" readonly style="font-family: monospace; font-size: 12px; background: #0f1015; color: #4ade80; border: 1px solid #334155; padding: 10px; border-radius: 6px; width: 100%;"></textarea>
            </div>
        </div>
    </main>

    <script>
        const CORRECT_PASSWORD = "matthewsel18"; // Silakan ubah password sesuai keinginan

        window.onload = function() {
            if (sessionStorage.getItem("isLoggedIn") === "true") {
                showAdminPanel();
            }
        };

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const passInput = document.getElementById('adminPassword').value;
            
            if (passInput === CORRECT_PASSWORD) {
                sessionStorage.setItem("isLoggedIn", "true");
                showAdminPanel();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });

        function showAdminPanel() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminMain').style.display = 'block';
        }

        function logoutAdmin() {
            sessionStorage.removeItem("isLoggedIn");
            location.reload();
        }

        document.getElementById('addMovieForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const newMovie = {
                id: Date.now(),
                title: document.getElementById('title').value,
                year: parseInt(document.getElementById('year').value),
                genre: document.getElementById('genre').value,
                rating: document.getElementById('rating').value,
                duration: document.getElementById('duration').value,
                quality: document.getElementById('quality').value,
                poster: document.getElementById('poster').value,
                director: document.getElementById('director').value,
                country: document.getElementById('country').value,
                cast: document.getElementById('cast').value,
                synopsis: document.getElementById('synopsis').value,
                videoUrl: document.getElementById('videoUrl').value,
                downloadUrl: document.getElementById('videoUrl').value
            };

            try {
                let existingMovies = [];
                const response = await fetch('movies.json');
                if (response.ok) {
                    existingMovies = await response.json();
                }

                existingMovies.push(newMovie);
                const jsonString = JSON.stringify(existingMovies, null, 4);
                document.getElementById('jsonOutput').value = jsonString;
                document.getElementById('outputSection').style.display = 'block';
                
                alert('Berhasil digenerate! Silakan salin teks JSON di bawah dan perbarui file movies.json Anda.');
            } catch (error) {
                const jsonString = JSON.stringify([newMovie], null, 4);
                document.getElementById('jsonOutput').value = jsonString;
                document.getElementById('outputSection').style.display = 'block';
            }
        });
    </script>
</body>
</html>
