<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - RJMOVIE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-form { max-width: 600px; margin: 40px auto; background: #1e1e1e; padding: 30px; border-radius: 8px; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .admin-form label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: 600; }
        .admin-form input, .admin-form textarea, .admin-form select { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        .admin-form button { margin-top: 25px; width: 100%; padding: 12px; background: #3b82f6; border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .admin-form button:hover { background: #2563eb; }

        /* Style untuk Kotak Login Terpusat */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .login-box {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 40px 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }
        .login-logo {
            width: 140px; /* Ukuran logo diperbesar */
            margin-bottom: 20px;
            object-fit: contain;
        }
        .login-box h2 {
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 8px;
        }
        .login-box p {
            color: #888;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .login-box label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ccc;
            font-size: 14px;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .login-box button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }
        .login-box button:hover {
            background: #2563eb;
        }
        .error-msg {
            color: #ef4444;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <a href="index.html"><img src="logorjmovie.png" alt="Logo" class="site-logo"></a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
        </ul>
    </header>

    <!-- BAGIAN LOGIN DENGAN LOGO BESAR DI TENGAH -->
    <div id="loginSection" class="login-wrapper">
        <div class="login-box">
            <img src="logorjmovie.png" alt="RJMOVIE Logo" class="login-logo">
            <h2>Admin Panel Login</h2>
            <p>Masukkan password rahasia untuk mengelola film.</p>
            <form id="loginForm">
                <label>Password:</label>
                <input type="password" id="adminPassword" required placeholder="Masukkan password...">
                <button type="submit"><i class="fas fa-sign-in-alt"></i> Masuk</button>
                <p id="errorMsg" class="error-msg"><i class="fas fa-exclamation-circle"></i> Password salah! Silakan coba lagi.</p>
            </form>
        </div>
    </div>

    <!-- BAGIAN PANEL ADMIN UTAMA (Disembunyikan sebelum login) -->
    <main class="main-container" id="adminMain" style="display: none;">
        <div class="admin-form">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2><i class="fas fa-plus-circle"></i> Tambah Film Baru</h2>
                <button onclick="logoutAdmin()" style="width: auto; padding: 6px 12px; margin: 0; background: #ef4444; font-size: 12px;"><i class="fas fa-sign-out-alt"></i> Keluar</button>
            </div>
            
            <form id="addMovieForm">
                <label>Judul Film:</label>
                <input type="text" id="title" required placeholder="Contoh: Tumbal Birahi">

                <label>Tahun Rilis:</label>
                <input type="number" id="year" required value="2026">

                <label>Genre (Pisahkan dengan koma):</label>
                <input type="text" id="genre" required placeholder="Horror, Action, Comedy">

                <label>Rating (Contoh: 6.8):</label>
                <input type="text" id="rating" required value="7.0">

                <label>Durasi (Contoh: 90 Menit):</label>
                <input type="text" id="duration" required value="90 Menit">

                <label>Kualitas (HD / CAM):</label>
                <select id="quality">
                    <option value="HD">HD</option>
                    <option value="CAM">CAM</option>
                </select>

                <label>Nama File Poster (Contoh: film1.png):</label>
                <input type="text" id="poster" required value="film1.png">

                <label>Sutradara:</label>
                <input type="text" id="director" required>

                <label>Negara:</label>
                <input type="text" id="country" required value="Indonesia">

                <label>Pemeran (Cast):</label>
                <input type="text" id="cast" required>

                <label>Sinopsis:</label>
                <textarea id="synopsis" rows="4" required></textarea>

                <label>Link Direct Video (.mp4 Internet Archive):</label>
                <input type="text" id="videoUrl" required placeholder="https://archive.org/download/.../file.mp4">

                <button type="submit"><i class="fas fa-save"></i> Generate JSON Data</button>
            </form>

            <div id="outputSection" style="margin-top: 20px; display: none;">
                <label>Hasil JSON (Salin dan perbarui isi file <code>movies.json</code> Anda):</label>
                <textarea id="jsonOutput" rows="6" readonly style="font-family: monospace; font-size: 12px; background: #111; color: #4ade80;"></textarea>
            </div>
        </div>
    </main>

    <script>
        const CORRECT_PASSWORD = "matthewsel18"; // Ganti password sesuai keinginan Anda

        window.onload = function() {
            if (sessionStorage.getItem("isLoggedIn") === "true") {
                showAdminPanel();
            }
        };

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const passInput = document.getElementById('adminPassword').value;
            
            if (passInput === CORRECT_PASSWORD) {
                sessionStorage.setItem("isLoggedIn", "true");
                showAdminPanel();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });

        function showAdminPanel() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminMain').style.display = 'block';
        }

        function logoutAdmin() {
            sessionStorage.removeItem("isLoggedIn");
            location.reload();
        }

        document.getElementById('addMovieForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const newMovie = {
                id: Date.now(),
                title: document.getElementById('title').value,
                year: parseInt(document.getElementById('year').value),
                genre: document.getElementById('genre').value,
                rating: document.getElementById('rating').value,
                duration: document.getElementById('duration').value,
                quality: document.getElementById('quality').value,
                poster: document.getElementById('poster').value,
                director: document.getElementById('director').value,
                country: document.getElementById('country').value,
                cast: document.getElementById('cast').value,
                synopsis: document.getElementById('synopsis').value,
                    videoUrl: document.getElementById('videoUrl').value,
                downloadUrl: document.getElementById('videoUrl').value
            };

            try {
                let existingMovies = [];
                const response = await fetch('movies.json');
                if (response.ok) {
                    existingMovies = await response.json();
                }

                existingMovies.push(newMovie);
                const jsonString = JSON.stringify(existingMovies, null, 4);
                document.getElementById('jsonOutput').value = jsonString;
                document.getElementById('outputSection').style.display = 'block';
                
                alert('Berhasil digenerate! Silakan salin teks JSON di bawah dan perbarui file movies.json Anda.');
            } catch (error) {
                const jsonString = JSON.stringify([newMovie], null, 4);
                document.getElementById('jsonOutput').value = jsonString;
                document.getElementById('outputSection').style.display = 'block';
            }
        });
    </script>
</body>
</html>
